<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Makro">
<meta name="theme-color" content="#ffffff">
<title>Makro</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #8a8a85;
    --line: #e6e6e1;
    --accent: #2f7d5b;
    --accent-soft: #e5f1eb;
    --danger: #c0392b;
    --p: #2f7d5b;  /* Eiweiß */
    --c: #d08c2e;  /* Kohlenhydrate */
    --f: #4a6fa5;  /* Fett */
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --card: #1d1d1d; --text: #f1f1ee; --muted: #9a9a95;
      --line: #2c2c2c; --accent: #4fb386; --accent-soft: #1f3329;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    padding: env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 16px 16px 10px; display: flex; align-items: center; justify-content: space-between;
  }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.5px; }
  main { padding: 0 16px; max-width: 720px; margin: 0 auto; }

  .btn {
    border: 0; border-radius: 12px; padding: 12px 16px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn.round { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 26px; line-height: 44px; }

  .search {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 16px; margin-bottom: 14px;
  }
  .cat-title { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 4px 8px; }
  .list { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .thumb {
    width: 48px; height: 48px; border-radius: 10px; background: var(--bg); flex-shrink: 0;
    object-fit: contain; display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .item-main { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .macros { display: flex; gap: 10px; font-size: 13px; margin-top: 4px; }
  .macros span b { font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .kcal { font-weight: 700; text-align: right; white-space: nowrap; }
  .kcal small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; line-height: 1.5; }
  .empty .big { font-size: 48px; }

  /* Tab-Leiste */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: 0; padding: 8px 0 10px; color: var(--muted);
    font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
  }
  nav button .ic { font-size: 22px; filter: grayscale(1); opacity: .6; }
  nav button.active { color: var(--accent); font-weight: 600; }
  nav button.active .ic { filter: none; opacity: 1; }

  /* Formular-Fenster */
  .sheet-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-bg.open { display: flex; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
  }
  @media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 20px; }
  .link { background: none; border: 0; color: var(--accent); font-size: 16px; cursor: pointer; padding: 6px; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 4px 6px; }
  input, select {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 16px; -webkit-appearance: none; appearance: none;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .preview { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .preview img { width: 72px; height: 72px; object-fit: contain; border-radius: 12px; background: var(--card); }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .row .btn { flex: 1; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 4px 0; line-height: 1.4; }
  .status { font-size: 14px; margin: 10px 4px 0; min-height: 20px; }

  #productSheet { z-index: 25; }
  #reader, #shopReader { width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
  #reader video, #shopReader video { border-radius: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px;
    opacity: 0; transition: opacity .25s; z-index: 30; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ---------- Küche: Kühlschrank 2/3 + Schrank 1/3 ---------- */
  :root {
    --fridge: #eef2f3; --fridge-edge: #cfd8dc; --shelf: #c3cdd2; --glass: rgba(255,255,255,.6);
    --ice: #e4f2fa; --ice-edge: #b5d9ec; --wood: #efe6da; --wood-edge: #d6c6af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fridge: #1f2427; --fridge-edge: #343c40; --shelf: #3d474c; --glass: rgba(255,255,255,.05);
      --ice: #18252d; --ice-edge: #2b4352; --wood: #2a2520; --wood-edge: #43392e;
    }
  }
  .kitchen { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; align-items: stretch; }
  .fridge, .cupboard { min-width: 0; display: flex; flex-direction: column; padding: 6px 8px 8px; }
  .fridge { background: var(--fridge); border: 3px solid var(--fridge-edge); border-radius: 22px; }
  .cupboard { background: var(--wood); border: 3px solid var(--wood-edge); border-radius: 14px; padding: 6px 6px 8px; }
  .unit-title { font-size: 12px; font-weight: 700; text-align: center; color: var(--muted); margin: 2px 0 2px; }
  .comp {
    flex: 1 0 auto; min-height: 84px; min-width: 0; padding: 6px 4px 8px; display: flex; flex-direction: column;
    border-bottom: 5px solid var(--shelf);
  }
  .cupboard .comp { min-height: 64px; border-bottom-color: var(--wood-edge); padding: 6px 2px 6px; }
  .cupboard .comp:last-child { border-bottom: 0; }
  .comp-label {
    font-size: 10px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cupboard .comp-label { white-space: normal; line-height: 1.3; }
  .comp-items { min-width: 0; margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
  .drawers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .comp.drawer { border: 3px solid var(--shelf); border-radius: 12px; background: var(--glass); min-height: 96px; }
  .comp.freezer { border: 3px solid var(--ice-edge); border-radius: 14px; background: var(--ice); margin-top: 8px; min-height: 96px; }

  .group { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; cursor: pointer; max-width: 100%; flex: 0 0 auto; }
  .pkgs { width: max-content; max-width: 100%; }
  .pkgs { display: flex; flex-wrap: wrap; gap: 3px; }
  .pkg {
    width: 32px; height: 32px; border-radius: 8px; background: var(--card);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    position: relative; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .cupboard .pkg { width: 26px; height: 26px; font-size: 14px; border-radius: 6px; }
  .pkg img { width: 100%; height: 100%; object-fit: contain; }
  .pkg.partial > img, .pkg.partial > .e { opacity: .35; }
  .pkg .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); opacity: .35; }
  .pkg.more { font-size: 11px; font-weight: 700; color: var(--muted); }
  .group-name { font-size: 11px; color: var(--muted); max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cupboard .group-name { max-width: 80px; font-size: 10px; }
  .fridge-hint { text-align: center; color: var(--muted); font-size: 14px; margin: 14px 0 0; line-height: 1.5; }

  .btn.pill { border-radius: 22px; padding: 10px 16px; font-size: 15px; }

  /* Einkaufen */
  .shop-list { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .shop-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .shop-item:last-child { border-bottom: 0; }
  .shop-item.on { background: var(--accent-soft); }
  .shop-item .thumb { width: 38px; height: 38px; font-size: 18px; }
  .shop-item .packIn { padding: 6px 10px; font-size: 14px; margin-top: 4px; max-width: 150px; }
  .mini { display: flex; align-items: center; gap: 6px; }
  .mini button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 20px; font-weight: 700; cursor: pointer; }
  .shop-item.on .mini button { background: var(--accent); color: #fff; }
  .mini span { min-width: 22px; text-align: center; font-weight: 700; }

  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 48px; height: 48px; border-radius: 12px; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 24px; font-weight: 700; cursor: pointer; }
  .stepper input { text-align: center; font-size: 20px; font-weight: 700; }
  .big-stock { font-size: 26px; font-weight: 700; margin: 6px 4px 0; }
  /* ---------- Mahlzeit ---------- */
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .card-title { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; }
  .big-kcal { font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
  .big-kcal small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .macro-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; margin-top: 6px; }
  .log-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .macro-row + .log-item { margin-top: 12px; }
  .log-item .t { color: var(--muted); width: 42px; }
  .log-item .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-item .k { font-weight: 600; }
  .undo { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 4px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; margin: 0 -16px 14px; padding-left: 16px; padding-right: 16px; -webkit-overflow-scrolling: touch; }
  .chip { flex-shrink: 0; background: var(--card); border-radius: 14px; padding: 10px 30px 10px 12px; min-width: 120px; position: relative; cursor: pointer; }
  .chip b { display: block; font-size: 15px; }
  .chip small { color: var(--muted); font-size: 12px; }
  .chip .x { position: absolute; top: 4px; right: 4px; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px 6px; }
  .meal-list { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin: 10px 0; }
  .meal-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--line); }
  .meal-item:last-child { border-bottom: 0; }
  .meal-item .thumb { width: 38px; height: 38px; font-size: 18px; }
  .meal-item .item-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gwrap { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .gbox { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 14px; }
  .meal-item .gin { width: 72px; text-align: right; padding: 7px 9px; }
  .meal-item .ik { font-size: 12px; color: var(--muted); }
  .rm { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px; }
  .warn { color: var(--c); font-weight: 600; }
  .totals { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  /* ---------- Heute ---------- */
  .daynav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .daynav b { font-size: 17px; }
  .navbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); color: var(--text); font-size: 20px; cursor: pointer; }
  .navbtn:disabled { opacity: .3; }
  .ring-wrap { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 132px; height: 132px; flex-shrink: 0; }
  .ring svg { width: 132px; height: 132px; transform: rotate(-90deg); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ring-center b { font-size: 26px; letter-spacing: -.5px; }
  .ring-center small { font-size: 12px; color: var(--muted); }
  .ring-side { flex: 1; min-width: 0; font-size: 14px; line-height: 1.7; }
  .ring-side .rem { font-size: 18px; font-weight: 700; }
  .bar-row { margin-top: 14px; }
  .bar-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  .bar-head span:last-child { color: var(--muted); }
  .bar { height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 5px; }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 9px; font-size: 15px; color: var(--text); cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 8px; }
  .calc-result { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 14px; line-height: 1.6; }
  /* ---------- Mahlzeiten-Tab & Slots ---------- */
  #pickSheet { z-index: 26; }
  .meal-card { cursor: pointer; }
  .mc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .mc-head b { font-size: 17px; }
  .mc-kcal { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .mc-ing { font-size: 13px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-head { display: flex; justify-content: space-between; align-items: center; }
  .slot-head span:first-child { font-size: 16px; }
  .slot-kcal { color: var(--muted); font-size: 14px; font-weight: 600; }
  .entry { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); margin-top: 8px; }
  .entry + .entry { margin-top: 0; }
  .entry .k { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .add-slot { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 15px; padding: 10px 0 0; cursor: pointer; }
  /* ---------- Ideen ---------- */
  .filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 2px 16px 4px; -webkit-overflow-scrolling: touch; }
  .filters button { flex-shrink: 0; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 18px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .recipe { cursor: pointer; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 3px 9px; border-radius: 10px; font-weight: 600; }
  .tag.grey { background: var(--bg); color: var(--muted); }
  .have { color: var(--accent); font-weight: 600; font-size: 14px; margin-top: 10px; }
  .miss { color: var(--c); font-weight: 600; font-size: 14px; margin-top: 10px; }
  .ing { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .ing:last-child { border-bottom: 0; }
  .ing .g { color: var(--muted); white-space: nowrap; }
  .steps { margin: 6px 0 0; padding-left: 20px; line-height: 1.55; font-size: 15px; }
  .steps li { margin-bottom: 6px; }
  /* Rezeptbilder */
  .rc { display: flex; gap: 12px; align-items: flex-start; }
  .rimg { width: 88px; height: 88px; border-radius: 14px; overflow: hidden; flex-shrink: 0; }
  .rimg svg, .rimg img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .rmain { flex: 1; min-width: 0; }
  .rmain .mc-head b { font-size: 16px; line-height: 1.25; }
  .rmain .mc-kcal { font-size: 15px; }
  .rhero { width: 100%; aspect-ratio: 16 / 10; border-radius: 18px; overflow: hidden; margin-bottom: 10px; }
  .rhero svg, .rhero img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .photo-row { display: flex; gap: 14px; justify-content: center; margin-bottom: 12px; }
  /* ---------- Realistischer Kühlschrank & Schrank ---------- */
  .kitchen { padding: 10px 2px 14px; gap: 12px; }
  .unit-title, .comp-label { display: none; }
  .fridge {
    position: relative; padding: 14px 8px 10px;
    background: linear-gradient(180deg, #fbfdfe 0%, #eef3f6 60%, #e4ecf0 100%);
    border: 9px solid #dde3e7; border-radius: 22px;
    box-shadow: inset 0 0 0 2px #c9d1d6, inset 0 -40px 50px rgba(110,150,175,.10), 0 8px 16px rgba(0,0,0,.14);
  }
  .fridge::before { content: ""; position: absolute; top: 4px; left: 35%; right: 35%; height: 4px; border-radius: 2px; background: #fffbe8; box-shadow: 0 0 14px 6px rgba(255,246,200,.85); }
  .fridge::after { content: ""; position: absolute; right: -16px; top: 16%; width: 5px; height: 84px; border-radius: 3px; background: linear-gradient(90deg, #b3bbc1, #dfe4e7); box-shadow: 1px 1px 2px rgba(0,0,0,.15); }
  .fridge .comp { position: relative; border-bottom: 0; padding: 8px 6px 14px; min-height: 80px; }
  .fridge .comp::after { content: ""; position: absolute; left: -8px; right: -8px; bottom: 0; height: 6px; background: linear-gradient(180deg, rgba(215,236,246,.95), rgba(170,205,222,.75)); border-top: 1px solid #fff; box-shadow: 0 3px 4px rgba(60,90,110,.12); }
  .drawers { margin-top: 10px; }
  .fridge .comp.drawer {
    border: 2px solid rgba(160,190,206,.9); border-radius: 6px 6px 12px 12px; padding: 8px 6px 18px; min-height: 92px;
    background: linear-gradient(180deg, rgba(255,255,255,.35) 0 52%, rgba(206,226,236,.75) 52% 100%);
  }
  .fridge .comp.drawer::after { left: 32%; right: 32%; bottom: 6px; height: 5px; border-radius: 3px; border: 0; background: rgba(140,170,188,.7); box-shadow: none; }
  .fridge .comp.freezer {
    margin-top: 20px; border: 2px solid #b6d6e6; border-radius: 10px; padding: 10px 6px 12px; min-height: 96px;
    background:
      radial-gradient(circle at 15% 22%, rgba(255,255,255,.95) 0 2px, transparent 3px),
      radial-gradient(circle at 72% 62%, rgba(255,255,255,.85) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 44% 86%, rgba(255,255,255,.85) 0 2px, transparent 3px),
      radial-gradient(circle at 88% 18%, rgba(255,255,255,.8) 0 1.5px, transparent 2.5px),
      linear-gradient(180deg, #eef8fd, #d3e9f5);
  }
  .fridge .comp.freezer::after { left: -10px; right: -10px; top: -16px; bottom: auto; height: 8px; border: 0; border-radius: 2px; background: #dde3e7; box-shadow: 0 1px 0 #c9d1d6; }
  .cupboard {
    position: relative; padding: 10px 7px 6px;
    background: repeating-linear-gradient(90deg, rgba(150,100,50,.05) 0 2px, transparent 2px 11px), linear-gradient(180deg, #f1e2c9, #e6d0ad);

  .cupboard::before { content: ""; position: absolute; top: -15px; left: -13px; right: -13px; height: 8px; border-radius: 3px; background: linear-gradient(180deg, #9c6738, #7f5028); }

  /* ---------- Vollbild-Scanner ---------- */
  #scanOverlay {
    position: fixed; inset: 0; z-index: 40; background: #0b0b0b; color: #fff;

  #camReader { width: 100%; max-width: 640px; }
  #camReader video { display: block; width: 100% !important; }
  .scan-info { padding: 14px 16px 0; text-align: center; }
  .scan-status { font-size: 15px; line-height: 1.45; min-height: 44px; color: #e6e6e6; }

  .toast { z-index: 50; }
  .update-bar {
    position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); z-index: 45;
    background: var(--accent); color: #fff; border-radius: 14px; padding: 12px 14px; font-size: 14px; text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.2); display: none; cursor: pointer;
  }
  .update-bar.show { display: block; }
  .app-version { text-align: center; color: var(--muted); font-size: 12px; margin: 18px 0 6px; }
  /* ---------- Ordentliche Stapel im Kühlschrank ---------- */
  .comp-items {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 12px 6px; align-items: end; justify-items: center;
  }
  .cupboard .comp-items { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 10px 4px; }

  .stack { position: relative; display: flex; flex-direction: column-reverse; align-items: center; padding-top: 4px; }
  .stack .pkg {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 9px;

  .cnt {

  .fridge .group-name, .cupboard .group-name {
    width: 100%; max-width: none; text-align: center; font-size: 10px; line-height: 1.2;

  /* =========================================================

<body>

<!-- Produkt anlegen / bearbeiten -->

<script>
/* ---------- Grunddaten ---------- */
const CATEGORIES = [
  /* Kühlschrank */
  { id: "milch",         name: "Milchprodukte",             short: "Milch",           icon: "🥛" },
  { id: "fleisch",       name: "Fleisch & Fisch",           short: "Fleisch & Fisch", icon: "🥩" },
  { id: "gemuese",       name: "Gemüse",                    short: "Gemüse",          icon: "🥦" },
  { id: "obst",          name: "Obst",                      short: "Obst",            icon: "🍎" },
  { id: "tiefkuehl",     name: "Tiefkühl",                  short: "❄️ Tiefkühl",     icon: "🧊" },
  /* Schrank */
  { id: "kohlenhydrate", name: "Kartoffeln, Reis & Nudeln", short: "Kartoffeln, Reis, Nudeln", icon: "🍝" },
  { id: "oel",           name: "Öl & Fett",                 short: "Öl",              icon: "🫒" },
  { id: "backen",        name: "Backzutaten",               short: "Backen",          icon: "🧁" },
  { id: "gewuerze",      name: "Gewürze",                   short: "Gewürze",         icon: "🧂" },
  { id: "suess",         name: "Süßigkeiten",               short: "Süßes",           icon: "🍫" },
  { id: "sonstiges",     name: "Sonstiges",                 short: "Sonstiges",       icon: "📦" }
];
/* Kategorien aus Version 1 umziehen */
const OLD_CATS = { protein: "sonstiges", konserven: "sonstiges", getraenke: "sonstiges" };

const STORE_KEY = "makro.products";

function loadProducts() {
  try {
    const list = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
    list.forEach(p => { if (OLD_CATS[p.cat]) p.cat = OLD_CATS[p.cat]; });
    return list;
  }
  catch (e) { return []; }
}
function saveProducts() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(products)); }
  catch (e) { toast("Speichern fehlgeschlagen"); }
}

let products = loadProducts();

/* Bestand: Produkt-ID -> Menge in g/ml */
const STOCK_KEY = "makro.stock";
let stock = (() => { try { return JSON.parse(localStorage.getItem(STOCK_KEY)) || {}; } catch (e) { return {}; } })();
function saveStock() {
  try { localStorage.setItem(STOCK_KEY, JSON.stringify(stock)); }
  catch (e) { toast("Speichern fehlgeschlagen"); }
}
let editingId = null;
let currentImage = "";
let searchTerm = "";

const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };
const r1 = n => Math.round(n * 10) / 10;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2000);
}

  currentTab = tab;
  document.body.dataset.tab = tab;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));

function soon(icon, text) {
  $("view").innerHTML = `<div class="empty"><div class="big">${icon}</div>${text}<br>Kommt im nächsten Schritt.</div>`;
}

/* ---------- Produktliste ---------- */
function renderProducts() {
  const view = $("view");
  if (!products.length) {
    view.innerHTML = `<div class="empty"><div class="big">🥫</div>
      Noch keine Produkte.<br>Tippe oben auf <b>+</b> und scanne den Barcode deines ersten Produkts.</div>`;
    return;
  }
  const term = searchTerm.toLowerCase();
  let html = `<input class="search" id="search" placeholder="Produkt suchen" value="${esc(searchTerm)}">`;
  let found = 0;
  for (const cat of CATEGORIES) {
    const items = products
      .filter(p => p.cat === cat.id && p.name.toLowerCase().includes(term))
      .sort((a, b) => a.name.localeCompare(b.name, "de"));
    if (!items.length) continue;
    found += items.length;
    html += `<div class="cat-title">${cat.icon} ${cat.name}</div><div class="list">`;
    for (const p of items) {
      const img = p.image
        ? `<img class="thumb" src="${esc(p.image)}" alt="" loading="lazy">`
        : `<div class="thumb">${cat.icon}</div>`;
      html += `<div class="item" data-id="${p.id}">
        ${img}
        <div class="item-main">
          <div class="item-name">${esc(p.name)}</div>
          <div class="macros">
            <span><i class="dot" style="background:var(--p)"></i><b>${r1(p.p)}</b> E</span>
            <span><i class="dot" style="background:var(--c)"></i><b>${r1(p.c)}</b> K</span>
            <span><i class="dot" style="background:var(--f)"></i><b>${r1(p.f)}</b> F</span>
          </div>
        </div>
        <div class="kcal">${Math.round(p.kcal)}<small>kcal/100 g</small></div>
      </div>`;
    }
    html += `</div>`;
  }
  if (!found) html += `<div class="empty">Nichts gefunden.</div>`;
  view.innerHTML = html;

  const s = $("search");
  s.oninput = () => { searchTerm = s.value; renderProducts(); const n = $("search"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  view.querySelectorAll(".item").forEach(el => el.onclick = () => openSheet(el.dataset.id));
}

  const resume = resumeShopScan && $("shopSheet").classList.contains("open");
  resumeShopScan = false;
  returnToShop = false;
  lookupSeq++;
  $("productSheet").classList.remove("open");
  if (resume) setTimeout(startShopScan, 250);
}

$("saveBtn").onclick = () => {
  const name = $("fName").value.trim();
  if (!name) { toast("Bitte einen Namen eingeben"); return; }
  const data = {
    name,
    cat: $("fCat").value,
    pack: num($("fPack").value),
    kcal: num($("fKcal").value),
    p: num($("fP").value),
    c: num($("fC").value),
    f: num($("fF").value),
    barcode: $("fBarcode").value.trim(),
    image: currentImage
  };
  if (editingId) {
    Object.assign(products.find(x => x.id === editingId), data);
  } else {
    if (data.barcode && products.some(x => sameCode(x.barcode, data.barcode))) {
      toast("Dieses Produkt hast du schon"); return;
    }
    const np = { id: Date.now().toString(36), ...data };
    products.push(np);
    if (returnToShop) cart[np.id] = (cart[np.id] || 0) + 1;
  }
  const backToShop = returnToShop;
  saveProducts();
  closeSheet();
  TABS[currentTab].render();
  if (backToShop) { renderShopList(); toast("Neu angelegt und im Wagen ✓"); }
  else toast("Gespeichert ✓");
};

$("deleteBtn").onclick = () => {
  if (!confirm("Produkt wirklich löschen?")) return;
  products = products.filter(x => x.id !== editingId);
  delete stock[editingId];
  saveProducts();
  saveStock();
  closeSheet();
  TABS[currentTab].render();
  toast("Gelöscht");
};

/* ---------- Barcode-Scan & Open Food Facts ---------- */
const sameCode = (a, b) => !!a && !!b && (a === b || a === "0" + b || "0" + a === b);

function validBarcode(c) {
  if (!/^(\d{8}|\d{12}|\d{13})$/.test(c)) return false;
  if (c.length === 8) return true;
  const d = c.split("").map(Number), check = d.pop();
  let sum = 0;
  d.reverse().forEach((n, i) => { sum += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - sum % 10) % 10 === check;
}

/* Ein gemeinsamer Scanner. Die Kamera bleibt zwischen zwei Scans offen,
   damit das iPhone sie nicht jedes Mal neu freigeben muss. */
const Cam = {
  inst: null, queue: Promise.resolve(), mode: null, onCode: null, title: "",
  seen: {}, streak: {}, done: {}, idleTimer: null, savedCb: null,

  run(fn) { const p = this.queue.catch(() => {}).then(fn); this.queue = p; return p; },
  state() { try { return this.inst ? this.inst.getState() : 0; } catch (e) { return 0; } },
  isOpen() { return $("scanOverlay").classList.contains("open"); },

  open(mode, onCode, title) {
    clearTimeout(this.idleTimer);
    this.mode = mode; this.onCode = onCode; this.savedCb = onCode; this.title = title;
    this.seen = {}; this.streak = {}; this.done = {};
    $("camTitle").textContent = title;
    $("camManual").style.display = mode === "single" ? "" : "none";
    $("camRetry").style.display = "none";
    this.status(mode === "single"
      ? "Halte den Barcode in den Rahmen – ca. 15–20 cm Abstand."
      : "Scanne Produkt für Produkt. Für ein zweites gleiches Produkt kurz wegziehen und nochmal scannen.");
    $("scanOverlay").classList.add("open");
    return this.run(async () => {
      if (typeof Html5Qrcode === "undefined") throw new Error("nolib");
      const st = this.state();
      if (st === 3) { this.inst.resume(); return; }   // pausiert -> sofort weiter
      if (st === 2) return;                             // läuft schon
      await this.hardStop();
      await this.boot();
    }).catch(err => this.fail(err));
  },

  async boot() {
    const formats = [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E
    ];
    const base = {
      fps: 12, disableFlip: true,
      qrbox: (w, h) => ({ width: Math.max(150, Math.floor(w * 0.84)), height: Math.max(90, Math.floor(Math.min(w, h) * 0.42)) })
    };
    const attempts = [
      { ...base, videoConstraints: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } },
      base
    ];
    let lastErr;
    for (const cfg of attempts) {
      const inst = new Html5Qrcode("camReader", { formatsToSupport: formats, verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
      try {
        await inst.start({ facingMode: "environment" }, cfg, code => this.hit(code), () => {});
        this.inst = inst;
        /* Neuere iPhones fokussieren nah schlecht – leichter Zoom hilft */
        try {
          const caps = inst.getRunningTrackCapabilities();
          if (caps && caps.zoom && caps.zoom.max >= 1.5) await inst.applyVideoConstraints({ advanced: [{ zoom: Math.min(2, caps.zoom.max) }] });
        } catch (e) {}
        return;
      } catch (e) {
        lastErr = e;
        try { inst.clear(); } catch (_) {}
        if (/NotAllowed|Permission|denied/i.test(String(e))) break;
      }
    }
    throw lastErr;
  },

  hit(code) {
    if (!this.onCode) return;
    code = String(code).trim();
    if (!validBarcode(code)) return;
    const now = Date.now(), prev = this.seen[code] || 0;
    this.seen[code] = now;
    if (now - prev > 1200) { this.streak[code] = 1; this.done[code] = false; }   // neues Hinhalten
    else this.streak[code] = (this.streak[code] || 1) + 1;
    if (this.streak[code] < 2 || this.done[code]) return;                         // 2× gleich gelesen = sicher
    this.done[code] = true;
    this.flash();
    const cb = this.onCode;
    if (this.mode === "single") this.close();
    cb(code);
  },

  close() {
    $("scanOverlay").classList.remove("open");
    this.onCode = null;
    this.run(async () => { if (this.state() === 2) { try { this.inst.pause(true); } catch (e) {} } });
    clearTimeout(this.idleTimer);
    this.idleTimer = setTimeout(() => this.run(() => this.hardStop()), 25000);   // nach 25 s Kamera ganz aus
  },

  async hardStop() {
    const inst = this.inst; this.inst = null;
    if (!inst) return;
    try { const st = inst.getState(); if (st === 2 || st === 3) await inst.stop(); } catch (e) {}
    try { inst.clear(); } catch (e) {}
  },

  fail(err) {
    const msg = String(err && (err.message || err) || "");
    const perm = /NotAllowed|Permission|denied/i.test(msg);
    this.status(typeof Html5Qrcode === "undefined"
      ? "Scanner nicht geladen – prüf dein Internet und öffne die App neu."
      : perm
        ? "Kein Kamerazugriff. Tippe auf „Nochmal versuchen“ und dann auf „Erlauben“. Kommt keine Frage: Einstellungen › Apps › Safari › Kamera › Fragen."
        : "Die Kamera startet gerade nicht. Tippe auf „Nochmal versuchen“ – sonst die App einmal ganz schließen.", "bad");
    $("camRetry").style.display = "";
  },

  status(text, cls = "") { const el = $("camStatus"); el.textContent = text; el.className = "scan-status " + cls; },
  flash() { const w = $("camWrap"); w.classList.add("hit"); setTimeout(() => w.classList.remove("hit"), 350); }
};

let lookupSeq = 0;
async function fetchOFF(code, fields) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 9000);
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${fields}`, { signal: ctrl.signal });
    return await res.json();
  } finally { clearTimeout(t); }
}

async function lookup(code) {
  if (!code) { toast("Bitte Barcode eingeben"); return; }
  const my = ++lookupSeq;
  $("scanStatus").textContent = "Suche Produkt …";
  try {
    const fields = "product_name,product_name_de,brands,image_front_small_url,image_front_url,nutriments,product_quantity,quantity,categories_tags";
    let data = await fetchOFF(code, fields);
    if ((data.status !== 1 || !data.product) && code.length === 12) data = await fetchOFF("0" + code, fields);
    if (my !== lookupSeq) return;   // Fenster inzwischen zu oder neuer Scan
    if (data.status !== 1 || !data.product) {
      $("scanStatus").textContent = "Nicht gefunden. Trag die Nährwerte bitte selbst ein.";
      return;
    }
    const p = data.product, n = p.nutriments || {};
    const name = p.product_name_de || p.product_name || "";
    const brand = (p.brands || "").split(",")[0].trim();
    $("fName").value = brand && name && !name.toLowerCase().includes(brand.toLowerCase()) ? `${name} (${brand})` : (name || brand);
    const kcal = n["energy-kcal_100g"] ?? (n["energy_100g"] ? n["energy_100g"] / 4.184 : "");
    $("fKcal").value = kcal !== "" ? Math.round(kcal) : "";
    $("fP").value = n["proteins_100g"] != null ? r1(n["proteins_100g"]) : "";
    $("fC").value = n["carbohydrates_100g"] != null ? r1(n["carbohydrates_100g"]) : "";
    $("fF").value = n["fat_100g"] != null ? r1(n["fat_100g"]) : "";
    if (p.product_quantity) $("fPack").value = Math.round(num(p.product_quantity));
    $("fCat").value = guessCategory(p.categories_tags || [], name);
    setImage(p.image_front_small_url || p.image_front_url || "");
    const missing = [$("fKcal"), $("fP"), $("fC"), $("fF")].some(i => i.value === "");
    $("scanStatus").textContent = missing
      ? "Gefunden ✓ – einige Werte fehlen, bitte ergänzen."
      : "Gefunden ✓ – prüf kurz die Werte und tippe auf Sichern.";
  } catch (e) {
    if (my !== lookupSeq) return;
    $("scanStatus").textContent = "Keine Verbindung. Tippe nochmal auf „Suchen“ oder trag die Werte selbst ein.";
  }
}

function guessCategory(tags, name) {
  const t = (tags.join(" ") + " " + name).toLowerCase();
  const has = (...w) => w.some(x => t.includes(x));
  if (has("frozen", "tiefkühl", "tiefgekühlt", "surgel")) return "tiefkuehl";
  if (has("chocolate", "schokolade", "sweets", "süßwaren", "candy", "gummi", "biscuit", "kekse", "confectioner", "snacks-sucres")) return "suess";
  if (has("meat", "fleisch", "fish", "fisch", "hack", "chicken", "hähnchen", "pute", "lachs", "thunfisch", "wurst", "sausage", "seafood")) return "fleisch";
  if (has("dairy", "milch", "quark", "joghurt", "yogurt", "käse", "cheese", "skyr", "sahne", "butter", "eggs", "eier")) return "milch";
  if (has("fruit", "obst", "banane", "apfel", "beere", "berries", "orange")) return "obst";
  if (has("vegetable", "gemüse", "paprika", "tomate", "gurke", "salat", "zwiebel", "möhre", "karotte")) return "gemuese";
  if (has("pasta", "nudel", "rice", "reis", "kartoffel", "potato", "bread", "brot", "haferflocken", "oats", "cereal")) return "kohlenhydrate";
  if (has("vegetable-oils", "olive-oil", "oils", "öl ", "olivenöl", "rapsöl", "sonnenblumenöl")) return "oel";
  if (has("flour", "mehl", "sugar", "zucker", "baking", "backpulver", "hefe", "vanill")) return "backen";
  if (has("spice", "gewürz", "salz", "salt", "pfeffer", "pepper", "herbs", "kräuter", "paprikapulver")) return "gewuerze";
  return "sonstiges";
}

/* ---------- Kühlschrank ---------- */
const FRIDGE_CATS = ["milch", "fleisch", "gemuese", "obst", "tiefkuehl"];
const CUPBOARD_CATS = ["kohlenhydrate", "oel", "backen", "gewuerze", "suess", "sonstiges"];
const MAX_ICONS = 12;
const catOf = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1];
const catIcon = id => catOf(id).icon;
const packOf = p => p.pack > 0 ? p.pack : 100;
const fmt = n => Math.round(n).toLocaleString("de-DE");

function inStock(p) { return (stock[p.id] || 0) > 0.5; }

function packageInfo(p) {
  const g = stock[p.id] || 0, pack = packOf(p);
  const full = Math.floor((g + 0.5) / pack);
  const rest = g - full * pack;
  return { g, pack, full, partial: rest > 0.5 ? rest / pack : 0 };
}

function stockText(p) {
  const { g, full, partial } = packageInfo(p);
  let t = full ? `${full} ${full === 1 ? "Packung" : "Packungen"}` : "";
  if (partial) t += (t ? " + " : "") + "1 angebrochen";
  return { main: t || "Leer", sub: `${fmt(g)} g/ml insgesamt` };
}

function pkgHTML(p, fillShare) {
  const inner = p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : `<span class="e">${catIcon(p.cat)}</span>`;
  if (fillShare == null) return `<div class="pkg">${inner}</div>`;
  return `<div class="pkg partial">${inner}<div class="fill" style="height:${Math.max(8, Math.round(fillShare * 100))}%"></div></div>`;
}

const MAX_STACK = 5;
function groupHTML(p) {
  const { full, partial } = packageInfo(p);
  const total = full + (partial ? 1 : 0);
  /* Stapel von unten nach oben: volle Packungen, die angebrochene liegt oben */
  const fullShown = Math.min(full, MAX_STACK - (partial ? 1 : 0));
  let tiles = "";
  for (let i = 0; i < fullShown; i++) tiles += pkgHTML(p);
  if (partial) tiles += pkgHTML(p, partial);
  const badge = total > 1 ? `<span class="cnt">${total}</span>` : "";
  return `<div class="group" data-id="${p.id}">
    <div class="stack">${tiles}${badge}</div>
    <div class="group-name">${esc(p.name)}</div>
  </div>`;
}

function compHTML(catId, extraClass = "") {
  const items = products.filter(p => p.cat === catId && inStock(p))
    .sort((a, b) => a.name.localeCompare(b.name, "de"));
  return `<div class="comp ${extraClass}"><div class="comp-label">${catOf(catId).short}</div>
    <div class="comp-items">${items.map(groupHTML).join("")}</div></div>`;
}

function renderFridge() {
  const view = $("view");
  const anything = products.some(inStock);
  view.innerHTML = `
    <div class="kitchen">
      <div class="fridge">
        <div class="unit-title">Kühlschrank</div>
        ${compHTML("milch")}
        ${compHTML("fleisch")}
        <div class="drawers">${compHTML("gemuese", "drawer")}${compHTML("obst", "drawer")}</div>
        ${compHTML("tiefkuehl", "freezer")}
      </div>
      <div class="cupboard">
        <div class="unit-title">Schrank</div>
        ${CUPBOARD_CATS.map(c => compHTML(c)).join("")}
      </div>
    </div>
    ${anything ? "" : `<p class="fridge-hint">Noch leer. Tippe oben auf <b>🛒 Einkaufen</b> und trag deinen Einkauf ein.</p>`}
  `;
  view.querySelectorAll(".group").forEach(el => el.onclick = () => openStock(el.dataset.id));
}

/* ---------- Einkaufen ---------- */
let cart = {};          // Produkt-ID -> Anzahl Packungen
let pendingPack = {};   // Packungsgröße für Produkte ohne Angabe
let shopSearch = "";
let resumeShopScan = false;
let returnToShop = false;

const cartCount = () => Object.values(cart).reduce((a, b) => a + b, 0);

function openShop() {
  cart = {}; pendingPack = {}; shopSearch = "";
  $("shopSearch").value = "";
  renderShopList();
  $("shopSheet").classList.add("open");
}

function closeShop(force) {
  if (!force && cartCount() && !confirm("Einkauf verwerfen?")) return;
  stopShopScan();
  $("shopSheet").classList.remove("open");
}

function renderShopList() {
  const n = cartCount();
  $("shopSaveBtn").innerHTML = `<b>Einräumen${n ? ` (${n})` : ""}</b>`;
  const list = $("shopList");
  if (!products.length) {
    list.innerHTML = `<div class="empty" style="padding:30px 10px">Noch keine Produkte.<br>Scanne dein erstes Produkt oder leg es neu an.</div>`;
    return;
  }
  const term = shopSearch.toLowerCase();
  let html = "", found = 0;
  for (const cat of CATEGORIES) {
    const items = products.filter(p => p.cat === cat.id && p.name.toLowerCase().includes(term))
      .sort((a, b) => a.name.localeCompare(b.name, "de"));
    if (!items.length) continue;
    found += items.length;
    html += `<div class="cat-title">${cat.icon} ${cat.name}</div><div class="shop-list">`;
    for (const p of items) {
      const c = cart[p.id] || 0;
      const img = p.image ? `<img class="thumb" src="${esc(p.image)}" alt="" loading="lazy">` : `<div class="thumb">${cat.icon}</div>`;
      const sub = p.pack > 0
        ? `<div class="item-sub">${fmt(p.pack)} g pro Packung</div>`
        : (c ? `<input class="packIn" data-id="${p.id}" type="number" inputmode="decimal" placeholder="g pro Packung" value="${pendingPack[p.id] || ""}">`
             : `<div class="item-sub">Packungsgröße fehlt</div>`);
      html += `<div class="shop-item ${c ? "on" : ""}">
        ${img}
        <div class="item-main"><div class="item-name">${esc(p.name)}</div>${sub}</div>
        <div class="mini">
          ${c ? `<button data-id="${p.id}" data-d="-1">−</button><span>${c}</span>` : ""}
          <button data-id="${p.id}" data-d="1">+</button>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  if (!found) html += `<div class="empty" style="padding:30px 10px">Nichts gefunden.</div>`;
  list.innerHTML = html;
  list.querySelectorAll(".mini button").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    cart[id] = Math.max(0, (cart[id] || 0) + Number(b.dataset.d));
    if (!cart[id]) delete cart[id];
    renderShopList();
  });

}

$("shopCancel").onclick = () => closeShop(false);
$("shopNewBtn").onclick = () => { stopShopScan(); returnToShop = true; openSheet(); };

$("shopSaveBtn").onclick = () => {
  const ids = Object.keys(cart);
  if (!ids.length) { toast("Dein Wagen ist noch leer"); return; }
  for (const id of ids) {
    const p = products.find(x => x.id === id);
    if (p && !(p.pack > 0) && !(pendingPack[id] > 0)) { toast(`Packungsgröße für ${p.name} fehlt`); return; }
  }
  let total = 0;
  for (const id of ids) {
    const p = products.find(x => x.id === id);
    if (!p) continue;
    if (!(p.pack > 0)) p.pack = pendingPack[id];
    stock[id] = (stock[id] || 0) + cart[id] * p.pack;
    total += cart[id];
  }
  saveProducts();
  saveStock();
  closeShop(true);
  renderFridge();
  toast(`${total} ${total === 1 ? "Packung" : "Packungen"} eingeräumt ✓`);
};

const sumMacros = list => list.reduce((a, m) => ({ kcal: a.kcal + m.kcal, p: a.p + m.p, c: a.c + m.c, f: a.f + m.f }), { kcal: 0, p: 0, c: 0, f: 0 });
const validItems = items => items.filter(i => prod(i.id));

const defaultGrams = p => p.pack > 0 && p.pack < 100 ? p.pack : 100;

}

const PROFILE_KEY = "makro.profile", TARGET_KEY = "makro.targets";

let targets = loadJSON(TARGET_KEY, null);
let viewDay = null; // null = heute

const ACTIVITIES = [
  { v: 1.2,   t: "Kaum Bewegung" },
  { v: 1.375, t: "1–3× Training pro Woche" },
  { v: 1.55,  t: "3–5× Training pro Woche" },
  { v: 1.725, t: "6–7× Training pro Woche" },
  { v: 1.9,   t: "Leistungssport, oft 2× täglich" }
];
const GOALS = {
  aufbau:  { t: "Muskelaufbau (+300 kcal)",    d: 300,  p: 2.0 },
  halten:  { t: "Gewicht halten",              d: 0,    p: 1.8 },
  diaet:   { t: "Leicht abnehmen (−300 kcal)", d: -300, p: 2.2 },
  gewicht: { t: "Gewicht machen (−500 kcal)",  d: -500, p: 2.4 }
};

function calcNeeds(pf) {
  const a = num(pf.age), h = num(pf.height), w = num(pf.weight);
  if (!(a > 0 && h > 0 && w > 0)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (pf.sex === "w" ? -161 : 5);   // Mifflin-St Jeor
  const tdee = bmr * Number(pf.act);
  const g = GOALS[pf.goal] || GOALS.halten;
  const kcal = Math.round((tdee + g.d) / 10) * 10;
  const p = Math.round(w * g.p);
  const f = Math.round(w * 0.9);
  const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  return { bmr, tdee, kcal, p, c, f };
}

const dayShift = (day, n) => { const d = new Date(day + "T12:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv-SE"); };
const dayLabel = day => {
  const t = todayKey();
  if (day === t) return "Heute";
  if (day === dayShift(t, -1)) return "Gestern";
  return new Date(day + "T12:00").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
};

function barHTML(label, val, goal, color) {
  const pct = goal ? Math.min(100, val / goal * 100) : 0;
  return `<div class="bar-row">
    <div class="bar-head"><span><b>${label}</b></span><span>${Math.round(val)} / ${Math.round(goal)} g</span></div>
    <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
  </div>`;
}

function amountText(e) {
  if (e.kind === "product") return `${fmt(e.amount)} g`;
  if (e.kind === "recipe") return "1 Portion (Rezept)";
  if (e.kind === "meal") return e.amount === 1 ? "1 Portion" : `${String(e.amount).replace(".", ",")} Portionen`;
  return "";
}

function renderToday() {
  const view = $("view");
  const day = viewDay || todayKey();
  const isToday = day === todayKey();
  const entries = log.filter(e => e.day === day);
  const m = sumMacros(entries.map(e => e.totals));

  let html = `<div class="daynav">
    <button class="navbtn" id="dPrev">‹</button>
    <b>${dayLabel(day)}</b>
    <button class="navbtn" id="dNext" ${isToday ? "disabled" : ""}>›</button>
  </div>`;

  if (targets) {
    const r = 56, C = 2 * Math.PI * r;
    const share = targets.kcal ? m.kcal / targets.kcal : 0;
    const over = share > 1.02, rest = targets.kcal - m.kcal;
    html += `<div class="card">
      <div class="ring-wrap">
        <div class="ring">
          <svg viewBox="0 0 132 132">
            <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--t1)"/><stop offset="1" style="stop-color:var(--t2)"/></linearGradient></defs>
            <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
            <circle cx="66" cy="66" r="${r}" fill="none" stroke="${over ? "var(--danger)" : "url(#ringGrad)"}" stroke-width="12"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.min(1, share))}"/>
          </svg>
          <div class="ring-center"><b>${fmt(m.kcal)}</b><small>von ${fmt(targets.kcal)} kcal</small></div>
        </div>
        <div class="ring-side">
          <div class="rem" style="color:${over ? "var(--danger)" : "inherit"}">${rest >= 0 ? `Noch ${fmt(rest)} kcal` : `${fmt(-rest)} kcal drüber`}</div>
          <button class="undo" id="calcOpen" style="padding:4px 0;color:var(--accent);font-size:14px;font-weight:600">🧮 Kalorienrechner ›</button>
        </div>
      </div>
      ${barHTML("Eiweiß", m.p, targets.p, "var(--p)")}
      ${barHTML("Kohlenhydrate", m.c, targets.c, "var(--c)")}
      ${barHTML("Fett", m.f, targets.f, "var(--f)")}
    </div>`;
  } else {
    html += `<div class="card">
      <div class="card-title">${dayLabel(day)} gegessen</div>
      ${totalsHTML(m)}
      <p class="hint" style="margin:12px 0 10px">Berechne dein Tagesziel, dann siehst du hier, wie viel noch geht.</p>
      <button class="btn" id="calcOpen" style="width:100%">Kalorienrechner öffnen</button>
    </div>`;
  }

  for (const slot of SLOTS) {
    const se = entries.filter(e => e.slot === slot.id);
    const sk = sumMacros(se.map(e => e.totals)).kcal;
    html += `<div class="card slot" style="--sc:${slot.color}">
      <div class="slot-head"><span><span class="slot-ic">${slot.icon}</span><b>${slot.name}</b></span><span class="slot-kcal">${se.length ? `${Math.round(sk)} kcal` : ""}</span></div>
      ${se.map(e => `<div class="entry">
        <div class="item-main">
          <div class="item-name">${esc(e.name)}</div>
          <div class="item-sub">${[amountText(e), `${Math.round(e.totals.p)} E · ${Math.round(e.totals.c)} K · ${Math.round(e.totals.f)} F`].filter(Boolean).join(" · ")}</div>
        </div>
        <span class="k">${Math.round(e.totals.kcal)} kcal</span>
        <button class="rm" data-del="${e.id}">✕</button>
      </div>`).join("")}
      <button class="add-slot" data-slot="${slot.id}">＋ Hinzufügen</button>
    </div>`;
  }
  html += `<div class="app-version">Version ${APP_VERSION}</div>`;
  view.innerHTML = html;

  $("dPrev").onclick = () => { viewDay = dayShift(day, -1); renderToday(); };
  $("dNext").onclick = () => { const n = dayShift(day, 1); viewDay = n >= todayKey() ? null : n; renderToday(); };
  $("calcOpen").onclick = openCalc;
  view.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => openAdd(b.dataset.slot));
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => removeEntry(b.dataset.del));
}

function removeEntry(id) {
  const e = log.find(x => x.id === id);
  if (!e || !confirm(`„${e.name}“ entfernen? Die Zutaten kommen zurück in den Bestand.`)) return;
  for (const i of e.items || []) if (prod(i.id) && i.deducted > 0) stock[i.id] = (stock[i.id] || 0) + i.deducted;
  log = log.filter(x => x.id !== id);
  saveJSON(LOG_KEY, log); saveStock(); renderToday();
  toast("Entfernt");
}

          <div class="item-sub">${Math.round(m.p)} g Eiweiß${missingSomething(t.items) ? ` · <span class="warn">fehlt was</span>` : ""}</div></div>
        <span class="item-sub">${Math.round(m.kcal)} kcal</span></div>`;
    }).join("")}</div>`
      : `<div class="empty" style="padding:30px 10px">${templates.length ? "Nichts gefunden." : "Noch keine Mahlzeiten.<br>Leg sie im Tab „Mahlzeiten“ an."}</div>`;
  }
  list.querySelectorAll("[data-sel]").forEach(r => r.onclick = () => showAmount(r.dataset.sel));
}
$("addSeg").querySelectorAll("button").forEach(b => b.onclick = () => { addMode = b.dataset.v; showAddList(); });
$("addSearch").oninput = renderAddList;
$("addBack").onclick = showAddList;

function showAmount(id) {
  addSel = { kind: addMode === "produkte" ? "product" : "meal", id };
  $("addListView").style.display = "none";
  $("addAmountView").style.display = "block";
  if (addSel.kind === "product") {
    const p = prod(id);
    $("aPreview").innerHTML = p.image ? `<img src="${esc(p.image)}" alt="">` : "";
    $("aPreview").style.display = p.image ? "flex" : "none";
    $("aName").textContent = p.name;
    $("aLabel").textContent = "Menge (g)";
    $("aAmount").value = defaultGrams(p);
  } else {
    const t = templates.find(x => x.id === id);
    $("aPreview").style.display = "none";
    $("aName").textContent = t.name;
    $("aLabel").textContent = "Portionen";
    $("aAmount").value = 1;
  }
  updateAmount();
}

function selectedItems() {
  const a = Math.max(0, num($("aAmount").value));
  if (addSel.kind === "product") return [{ id: addSel.id, g: a }];
  const t = templates.find(x => x.id === addSel.id);
  return validItems(t.items).map(i => ({ id: i.id, g: i.g * a }));
}

function updateAmount() {
  const items = selectedItems();
  $("aTotals").innerHTML = totalsHTML(itemsMacros(items));
  $("aStock").innerHTML = addSel.kind === "product"
    ? stockNote(addSel.id, items[0].g)
    : (missingSomething(items) ? `<span class="warn">Nicht alle Zutaten sind im Bestand</span>` : "Alle Zutaten sind da ✓");
}
const amountStep = () => addSel.kind === "product" ? 10 : 0.5;
$("aAmount").oninput = updateAmount;
$("aMinus").onclick = () => { $("aAmount").value = Math.max(amountStep(), num($("aAmount").value) - amountStep()); updateAmount(); };
$("aPlus").onclick = () => { $("aAmount").value = num($("aAmount").value) + amountStep(); updateAmount(); };

$("aAdd").onclick = () => {
  const amount = num($("aAmount").value);
  if (!(amount > 0)) { toast("Bitte eine Menge eingeben"); return; }
  let short = false;
  const logged = selectedItems().filter(i => i.g > 0).map(i => {
    const p = prod(i.id), have = stock[i.id] || 0, deducted = Math.min(have, i.g);
    if (i.g > have + 0.5) short = true;
    stock[i.id] = have - deducted;
    if (stock[i.id] < 0.5) delete stock[i.id];
    return { id: i.id, name: p.name, g: i.g, deducted, ...macrosFor(p, i.g) };
  });
  const totals = sumMacros(logged);
  const now = new Date();
  const name = addSel.kind === "product" ? prod(addSel.id).name : templates.find(x => x.id === addSel.id).name;
  log.push({
    id: now.getTime().toString(36), day: viewDay || todayKey(), slot: addSlot,
    time: now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }),
    kind: addSel.kind, refId: addSel.id, name, amount, items: logged, totals
  });
  saveJSON(LOG_KEY, log);
  saveStock();
  $("addSheet").classList.remove("open");
  renderToday();
  toast(short ? "Eingetragen ✓ – nicht alles war im Bestand" : `${Math.round(totals.kcal)} kcal eingetragen ✓`);
};

/* ---------- Rezept-Illustrationen ---------- */
const PHOTO_KEY = "makro.recipePhotos";
let recipePhotos = loadJSON(PHOTO_KEY, {});

function seeded(seed) {
  let h = 2166136261;
  for (const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
/* ---------- Rezeptbilder (realistisch gezeichnet) ---------- */
let artSeq = 0;
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function makeArt(seed) {
  const R = seeded(seed), u = "a" + (++artSeq) + "_", defs = new Map();
  const f1 = n => +n.toFixed(1);
  const stopsHTML = st => st.map(([o, c, op]) => `<stop offset="${o}" stop-color="${c}"${op != null ? ` stop-opacity="${op}"` : ""}/>`).join("");
  const A = {
    R, u, f1,
    rnd: (a, b) => a + R() * (b - a),
    rg(name, st, o = {}) {
      const id = u + name;
      if (!defs.has(id)) defs.set(id, `<radialGradient id="${id}" cx="${o.cx ?? .38}" cy="${o.cy ?? .34}" r="${o.r ?? .75}">${stopsHTML(st)}</radialGradient>`);
      return `url(#${id})`;
    },
    lg(name, st, o = {}) {
      const id = u + name;
      if (!defs.has(id)) defs.set(id, `<linearGradient id="${id}" x1="${o.x1 ?? 0}" y1="${o.y1 ?? 0}" x2="${o.x2 ?? 0}" y2="${o.y2 ?? 1}">${stopsHTML(st)}</linearGradient>`);
      return `url(#${id})`;
    },
    rot: (a, x, y) => `transform="translate(${f1(x)} ${f1(y)}) rotate(${a.toFixed(0)})"`,
    /* unregelmäßige, weiche Form */
    blob(cx, cy, r, wob = .12, n = 12, ry) {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2, k = 1 + (R() - .5) * 2 * wob;
        pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * (ry ?? r) * k]);
      }
      const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
      let d = `M${mid(pts[n - 1], pts[0]).map(f1).join(" ")}`;
      for (let i = 0; i < n; i++) { const m = mid(pts[i], pts[(i + 1) % n]); d += `Q${f1(pts[i][0])} ${f1(pts[i][1])} ${f1(m[0])} ${f1(m[1])}`; }
      return d + "Z";
    },
    /* Punkte in einer Fläche verteilen, ohne dass alles übereinander klebt */
    place(reg, n, minD = 4) {
      const pts = [];
      for (let t = 0; t < n * 40 && pts.length < n; t++) {
        let x, y;
        if (reg.a0 != null) {
          const a = A.rnd(reg.a0, reg.a1), r = Math.sqrt(A.rnd((reg.r0 || 0) ** 2 / reg.r ** 2, 1)) * reg.r;
          x = reg.cx + Math.cos(a) * r; y = reg.cy + Math.sin(a) * r;
        } else if (reg.w) {
          x = reg.x + R() * reg.w; y = reg.y + R() * reg.h;
        } else {
          const a = R() * Math.PI * 2, r = Math.sqrt(R()) * reg.r;
          x = reg.cx + Math.cos(a) * r; y = reg.cy + Math.sin(a) * (reg.ry ?? reg.r) / reg.r * r;
        }
        if (pts.every(p => (p[0] - x) ** 2 + (p[1] - y) ** 2 >= minD * minD)) pts.push([x, y]);
      }
      return pts.sort((a, b) => a[1] - b[1]);
    },
    many(reg, n, minD, fn) { return A.place(reg, n, minD).map(([x, y]) => fn(x, y, A.rnd(0, 360))).join(""); },
    shadowGroup: body => `<g filter="url(#${u}sh)">${body}</g>`,

    /* ---- Untergründe ---- */
    table(kind) {
      let b = "";
      if (kind === "wood") {
        b += `<rect width="160" height="120" fill="${A.lg("wood", [[0, "#8a5d3b"], [1, "#5e3c24"]], { x2: 1, y2: 1 })}"/>`;
        for (let i = 0; i < 4; i++) {
          b += `<rect y="${i * 30}" width="160" height="30" fill="${["#000", "#fff"][i % 2]}" opacity="${f1(.04 + R() * .05)}"/>`;
          b += `<path d="M0 ${i * 30}H160" stroke="#2b1a0e" stroke-opacity=".45" stroke-width=".8"/>`;
          for (let k = 0; k < 4; k++) {
            const y = i * 30 + 4 + R() * 22;
            b += `<path d="M0 ${f1(y)}C40 ${f1(y + A.rnd(-3, 3))} 90 ${f1(y + A.rnd(-3, 3))} 160 ${f1(y + A.rnd(-2, 2))}" stroke="${R() > .5 ? "#2b1a0e" : "#c9935f"}" stroke-opacity=".18" stroke-width="${f1(A.rnd(.4, .9))}" fill="none"/>`;
          }
        }
      } else if (kind === "linen") {
        const pid = u + "lin";
        defs.set(pid, `<pattern id="${pid}" width="2.4" height="2.4" patternUnits="userSpaceOnUse"><path d="M0 .6H2.4M.6 0V2.4" stroke="#8b7a5e" stroke-opacity=".10" stroke-width=".5"/></pattern>`);
        b += `<rect width="160" height="120" fill="#ece3d3"/><rect width="160" height="120" fill="url(#${pid})"/>`;
        b += `<path d="M118 0L160 0L160 120L136 120Z" fill="#cfd9c8" opacity=".55"/><path d="M118 0L136 120" stroke="#b3c2a9" stroke-width=".8" opacity=".7"/>`;
      } else {
        b += `<rect width="160" height="120" fill="${A.lg("marble", [[0, "#f7f7f8"], [1, "#e6e6ea"]], { x2: 1 })}"/>`;
        for (let i = 0; i < 6; i++) {
          let x = A.rnd(-20, 160), y = A.rnd(-10, 40), d = `M${f1(x)} ${f1(y)}`;
          for (let k = 0; k < 5; k++) { x += A.rnd(10, 35); y += A.rnd(8, 28); d += `Q${f1(x - A.rnd(0, 20))} ${f1(y - A.rnd(-12, 12))} ${f1(x)} ${f1(y)}`; }

    light: () => `<rect width="160" height="120" fill="${A.rg("vig", [[0, "#fff", .14], [.55, "#fff", 0], [1, "#000", .28]], { cx: .32, cy: .25, r: .95 })}"/>`,

    lentil(x, y) { return `<circle cx="${f1(x)}" cy="${f1(y)}" r="1.1" fill="#f0a347" stroke="#c97a22" stroke-width=".3"/>`; },
    lemon(x, y, a, s = 1) {

    },
    swirl(cx, cy, w, col) {
      const d = `M${f1(cx - w / 2)} ${f1(cy + 2)}C${f1(cx - w / 4)} ${f1(cy - 7)} ${f1(cx + w / 4)} ${f1(cy + 8)} ${f1(cx + w / 2)} ${f1(cy - 1)}`;

    svg(body) {
      return `<svg viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><defs>${[...defs.values()].join("")}` +

  return A;

    b += `<path d="M58 20 L102 20 L101 31 L59 31 Z" fill="#fffaf0"/>` + A.many({ x: 61, y: 22, w: 38, h: 8 }, 16, 2.6, (x, y) => `<circle cx="${A.f1(x)}" cy="${A.f1(y)}" r="${A.f1(A.rnd(.5, 1.3))}" fill="#fff" stroke="#e8dcb8" stroke-width=".3"/>`);
    b += `<path d="M58 20 L102 20 L97 100 Q80 105 63 100 Z" fill="${glass}" stroke="#d3d9e0" stroke-width="1.2"/>`;
    b += `<path d="M63 28 L67 94" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".6"/><path d="M95 30 L93 60" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".45"/>`;
    b += `<g filter="url(#${A.u}sh)"><path d="M86 30 L104 4" stroke="#2fb380" stroke-width="4.6" stroke-linecap="round"/><path d="M86 30 L104 4" stroke="#fff" stroke-width="1.1" stroke-dasharray="3 3" stroke-linecap="round" opacity=".7"/></g>`;
    b += A.shadowGroup(A.banana(60, 22, 9));
    b += A.shadowGroup(A.banana(124, 92, 6) + A.banana(134, 84, 6) + A.banana(28, 90, 6));
    return b + A.light();
  },
  skyrapfel: A => {
    let b = A.table("marble") + A.bowl(78, 60, 50, "#d5c4e8");
    b += A.creamy(78, 60, 41, "#fbfaf6");
    b += A.shadowGroup(A.many({ cx: 78, cy: 60, r: 37, r0: 4, a0: -2, a1: 1.5 }, 24, 5.6, (x, y, a) => A.apple(x, y, a, 5.6)));
    b += A.drizzle(76, 60, 40, "#a8682a", 2);
    b += A.many({ cx: 70, cy: 64, r: 22 }, 30, 2.2, (x, y) => `<circle cx="${A.f1(x)}" cy="${A.f1(y)}" r=".5" fill="#8a5426" opacity=".7"/>`);
    return b + A.light();
  },
  huettenbrot: A => {
    let b = A.table("wood") + A.board(14, 16, 132, 88);
    const top = () => A.many({ cx: 0, cy: 1, r: 13 }, 30, 2.8, (x, y) => A.cottage(x, y, 2.4)) +
      A.cucumber(-7, -6, 5.4) + A.cucumber(6, 8, 5.2) + A.tomatoSlice(7, -6, 5.4) + A.tomatoSlice(-6, 8, 5) + A.herbs(0, 0, 12, 14);
    b += A.shadowGroup(A.bread(52, 60, -8, 1.95, top()) + A.bread(108, 60, 10, 1.95, top()));
    return b + A.light();
  }
};

function recipeArt(r) {
  const f = DISH[r.id];
  if (!f) return "";
  const A = makeArt(r.id);
  return A.svg(f(A));
}

const recipeImg = r => recipePhotos[r.id] ? `<img src="${recipePhotos[r.id]}" alt="">` : recipeArt(r);

/* Eigenes Foto: verkleinert und lokal gespeichert */
$("rPhotoBtn").onclick = () => $("rPhotoIn").click();
$("rPhotoDel").onclick = () => {
  delete recipePhotos[openRecipeId]; saveJSON(PHOTO_KEY, recipePhotos);
  openRecipe(openRecipeId); renderIdeas(); toast("Foto entfernt");
};
$("rPhotoIn").onchange = () => {
  const file = $("rPhotoIn").files[0];
  $("rPhotoIn").value = "";
  if (!file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const W = 640, H = 480, c = document.createElement("canvas");
    c.width = W; c.height = H;
    const sc = Math.max(W / img.width, H / img.height);
    const w = img.width * sc, h = img.height * sc;
    c.getContext("2d").drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    URL.revokeObjectURL(url);
    recipePhotos[openRecipeId] = c.toDataURL("image/jpeg", 0.72);
    saveJSON(PHOTO_KEY, recipePhotos);
    openRecipe(openRecipeId); renderIdeas(); toast("Foto gespeichert ✓");
  };
  img.onerror = () => toast("Foto konnte nicht geladen werden");
  img.src = url;
};
const RTYPES = { frueh: "Frühstück", haupt: "Hauptgericht", snack: "Snack" };
let ideaFilter = "alle";
let openRecipeId = null;

function matchProduct(key) {
  const d = ING[key];
  const hits = products.filter(p => {
    const n = p.name.toLowerCase();
    return d.k.some(w => n.includes(w)) && !(d.x || []).some(w => n.includes(w));
  });
  if (!hits.length) return null;
  return hits.sort((a, b) => (stock[b.id] || 0) - (stock[a.id] || 0))[0];
}

function analyzeRecipe(r) {
  const rows = r.ing.map(([key, g, opt]) => {
    const d = ING[key], p = matchProduct(key);
    const have = p ? (stock[p.id] || 0) : 0;
    const ok = !!p && have + 0.5 >= g;
    const m = p ? macrosFor(p, g) : { kcal: d.r[0] * g / 100, p: d.r[1] * g / 100, c: d.r[2] * g / 100, f: d.r[3] * g / 100 };
    return { key, name: d.n, g, opt: opt === "o", p, have, ok, m };
  });
  const missing = rows.filter(x => !x.opt && !x.ok);
  return { rows, missing, totals: sumMacros(rows.map(x => x.m)) };
}

function renderIdeas() {
  const view = $("view");
  const list = RECIPES.map(r => ({ r, a: analyzeRecipe(r) }))
    .filter(({ r, a }) =>
      ideaFilter === "alle" ? true :
      ideaFilter === "kochbar" ? a.missing.length === 0 :
      r.type === ideaFilter)
    .sort((x, y) => (x.a.missing.length - y.a.missing.length) || (y.a.totals.p / y.a.totals.kcal - x.a.totals.p / x.a.totals.kcal));

  const filters = [["alle", "Alle"], ["kochbar", "✓ Kann ich kochen"], ["frueh", "Frühstück"], ["haupt", "Hauptgericht"], ["snack", "Snack"]];
  let html = `<div class="filters">${filters.map(([k, t]) => `<button data-f="${k}" class="${ideaFilter === k ? "on" : ""}">${t}</button>`).join("")}</div>`;
  html += list.length ? list.map(({ r, a }) => `<div class="card recipe rc" data-r="${r.id}">
      <div class="rimg">${recipeImg(r)}</div>
      <div class="rmain">
      <div class="mc-head"><b>${r.name}</b><span class="mc-kcal">${Math.round(a.totals.kcal)} kcal</span></div>
      <div class="tags">
        <span class="tag">💪 ${Math.round(a.totals.p)} g Eiweiß</span>
        <span class="tag grey">${Math.round(a.totals.c)} g K · ${Math.round(a.totals.f)} g F</span>
        <span class="tag grey">${RTYPES[r.type]}</span>
      </div>
      ${a.missing.length ? `<div class="miss">Fehlt: ${a.missing.map(x => x.name).join(", ")}</div>` : `<div class="have">✓ Alles da</div>`}
      </div>
    </div>`).join("")
    : `<div class="empty"><div class="big">🥗</div>${ideaFilter === "kochbar" ? "Gerade reicht dein Bestand für kein Rezept komplett.<br>Schau unter „Alle“, was dir noch fehlt." : "Keine Rezepte gefunden."}</div>`;
  html += `<p class="hint" style="text-align:center;margin:4px 0 10px">Werte pro Portion – mit deinen Produkten berechnet, sonst mit Richtwerten.</p>`;
  view.innerHTML = html;
  view.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { ideaFilter = b.dataset.f; renderIdeas(); });
  view.querySelectorAll("[data-r]").forEach(c => c.onclick = () => openRecipe(c.dataset.r));
}

const slotByTime = () => { const h = new Date().getHours(); return h < 10 ? "fruehstueck" : h < 12 ? "snack1" : h < 15 ? "mittag" : h < 18 ? "snack2" : "abend"; };
$("rSlot").innerHTML = SLOTS.map(sl => `<option value="${sl.id}">${sl.icon} ${sl.name}${sl.id === "snack1" ? " (vormittags)" : sl.id === "snack2" ? " (nachmittags)" : ""}</option>`).join("");

function openRecipe(id) {
  openRecipeId = id;
  const r = RECIPES.find(x => x.id === id), a = analyzeRecipe(r);
  $("rTitle").textContent = r.name;
  $("rHero").innerHTML = recipeImg(r);
  $("rPhotoBtn").textContent = recipePhotos[id] ? "📷 Foto ändern" : "📷 Eigenes Foto";
  $("rPhotoDel").style.display = recipePhotos[id] ? "inline-block" : "none";
  $("rBody").innerHTML = `
    ${totalsHTML(a.totals)}
    <div class="card-title" style="margin-top:18px">Zutaten für 1 Portion</div>
    <div class="card" style="padding:4px 14px;margin-bottom:0">${a.rows.map(x => `<div class="ing">
      <div class="item-main">
        <div>${x.name}${x.opt ? ` <span class="item-sub">(optional)</span>` : ""}</div>
        <div class="item-sub">${x.p ? (x.ok ? `Dein Produkt: ${esc(x.p.name)}` : `<span class="warn">${esc(x.p.name)}: nur ${fmt(x.have)} g da</span>`) : (x.opt ? "Nicht im Bestand" : `<span class="warn">Nicht im Bestand</span>`)}</div>
      </div>
      <span class="g">${fmt(x.g)} g</span>
    </div>`).join("")}</div>
    <div class="card-title" style="margin-top:18px">So geht's</div>
    <ol class="steps">${r.steps.map(st => `<li>${st}</li>`).join("")}</ol>`;
  $("rSlot").value = r.type === "frueh" ? "fruehstueck" : slotByTime();
  $("recipeSheet").classList.add("open");
}

$("rAdd").onclick = () => {
  const r = RECIPES.find(x => x.id === openRecipeId), a = analyzeRecipe(r);
  let short = false;
  const logged = a.rows.filter(x => !x.opt || x.p).map(x => {
    if (!x.p) { short = true; return { id: null, name: x.name, g: x.g, deducted: 0, ...x.m }; }
    const have = stock[x.p.id] || 0, deducted = Math.min(have, x.g);
    if (x.g > have + 0.5) short = true;
    stock[x.p.id] = have - deducted;
    if (stock[x.p.id] < 0.5) delete stock[x.p.id];
    return { id: x.p.id, name: x.p.name, g: x.g, deducted, ...x.m };
  });
  const totals = sumMacros(logged), now = new Date();
  log.push({
    id: now.getTime().toString(36), day: todayKey(), slot: $("rSlot").value,
    time: now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }),
    kind: "recipe", refId: r.id, name: r.name, amount: 1, items: logged, totals
  });
  saveJSON(LOG_KEY, log); saveStock();
  $("recipeSheet").classList.remove("open");
  renderIdeas();
  toast(short ? "Eingetragen ✓ – fehlende Zutaten mit Richtwerten" : `${Math.round(totals.kcal)} kcal eingetragen ✓`);
};

$("rSave").onclick = () => {
  const r = RECIPES.find(x => x.id === openRecipeId), a = analyzeRecipe(r);
  const unknown = a.rows.filter(x => !x.opt && !x.p);
  if (unknown.length) { toast(`Leg zuerst als Produkt an: ${unknown.map(x => x.name).join(", ")}`); return; }
  if (templates.some(t => t.name.toLowerCase() === r.name.toLowerCase())) { toast("Diese Mahlzeit hast du schon gespeichert"); return; }
  templates.push({ id: Date.now().toString(36), name: r.name, items: a.rows.filter(x => x.p).map(x => ({ id: x.p.id, g: x.g })) });
  saveJSON(TPL_KEY, templates);
  toast("Unter „Mahlzeiten“ gespeichert ✓");
};

/* Rechner */
$("cAct").innerHTML = ACTIVITIES.map(a => `<option value="${a.v}">${a.t}</option>`).join("");
$("cGoal").innerHTML = Object.entries(GOALS).map(([k, g]) => `<option value="${k}">${g.t}</option>`).join("");

function readCalcForm() {
  return {
    sex: $("cSex").querySelector(".on")?.dataset.v || "m",
    age: $("cAge").value, height: $("cHeight").value, weight: $("cWeight").value,
    act: Number($("cAct").value), goal: $("cGoal").value
  };
}

function refreshCalc(fillTargets) {
  const r = calcNeeds(readCalcForm());
  if (!r) {
    $("cResult").innerHTML = "Trag Alter, Größe und Gewicht ein.";
  } else {
    $("cResult").innerHTML = `Grundumsatz: <b>${fmt(r.bmr)} kcal</b><br>
      Bedarf mit Training: <b>${fmt(r.tdee)} kcal</b><br>
      Empfehlung für dein Ziel: <b>${fmt(r.kcal)} kcal</b>`;
    if (fillTargets) { $("tKcal").value = r.kcal; $("tP").value = r.p; $("tC").value = r.c; $("tF").value = r.f; }
  }
  updateTargetHint();
}

function updateTargetHint() {
  const k = num($("tKcal").value), p = num($("tP").value), c = num($("tC").value), f = num($("tF").value);
  const sum = p * 4 + c * 4 + f * 9;
  $("tHint").innerHTML = k ? `Deine Makros ergeben ${fmt(sum)} kcal${Math.abs(sum - k) > 50 ? ` – <span class="warn">passt nicht ganz zu ${fmt(k)} kcal</span>` : " ✓"}.<br>
    Für schnelles Gewichtmachen vor Wettkämpfen plan das lieber mit deinem Trainer.` : "";
}

function openCalc() {
  $("cSex").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === (profile.sex || "m")));
  $("cAge").value = profile.age || ""; $("cHeight").value = profile.height || ""; $("cWeight").value = profile.weight || "";
  $("cAct").value = String(profile.act || 1.55); $("cGoal").value = profile.goal || "halten";
  if (targets) { $("tKcal").value = targets.kcal; $("tP").value = targets.p; $("tC").value = targets.c; $("tF").value = targets.f; refreshCalc(false); }
  else refreshCalc(true);
  $("calcSheet").classList.add("open");
}

$("cSex").querySelectorAll("button").forEach(b => b.onclick = () => {
  $("cSex").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  refreshCalc(true);
});
["cAge", "cHeight", "cWeight"].forEach(id => $(id).oninput = () => refreshCalc(true));
["cAct", "cGoal"].forEach(id => $(id).onchange = () => refreshCalc(true));
["tKcal", "tP", "tC", "tF"].forEach(id => $(id).oninput = updateTargetHint);

$("calcSave").onclick = () => {
  const t = { kcal: Math.round(num($("tKcal").value)), p: Math.round(num($("tP").value)), c: Math.round(num($("tC").value)), f: Math.round(num($("tF").value)) };
  if (!t.kcal) { toast("Trag zuerst deine Daten ein"); return; }
  profile = readCalcForm();
  targets = t;
  saveJSON(PROFILE_KEY, profile);
  saveJSON(TARGET_KEY, targets);
  $("calcSheet").classList.remove("open");
  TABS[currentTab].render();
  toast("Tagesziel gespeichert ✓");
};

/* Fenster schließen */
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => $(b.dataset.close).classList.remove("open"));
["stockSheet", "pickSheet", "calcSheet", "mealSheet", "addSheet", "recipeSheet"].forEach(id => $(id).addEventListener("click", e => { if (e.target.id === id) $(id).classList.remove("open"); }));

/* ---------- Untertitel in der Kopfzeile ---------- */
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function updateSub() {
  let t = "";
  if (currentTab === "heute") t = new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
  else if (currentTab === "kuehlschrank") t = plural(products.filter(inStock).length, "Produkt vorrätig", "Produkte vorrätig");
  else if (currentTab === "mahlzeit") t = plural(templates.length, "gespeicherte Mahlzeit", "gespeicherte Mahlzeiten");
  else if (currentTab === "produkte") t = plural(products.length, "Produkt angelegt", "Produkte angelegt");
  else if (currentTab === "vorschlaege") {
    const k = RECIPES.filter(r => analyzeRecipe(r).missing.length === 0).length;
    t = k ? `${plural(k, "Rezept", "Rezepte")} kannst du jetzt kochen` : "Fitness-Rezepte für deinen Kühlschrank";
  }
  $("subtitle").textContent = t;
}
new MutationObserver(updateSub).observe($("view"), { childList: true });

/* ---------- Version & Update-Prüfung ---------- */
const APP_VERSION = "12";
async function checkUpdate() {
  if (!/^https?:/.test(location.protocol)) return;
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const m = (await res.text()).match(/const APP_VERSION = "(\d+)"/);
    if (m && Number(m[1]) > Number(APP_VERSION)) {
      const bar = $("updateBar");
      bar.classList.add("show");
      bar.onclick = () => location.replace(location.pathname + "?v=" + m[1]);
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
checkUpdate();

/* ---------- Start ---------- */
showTab("heute");
</script>
